[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccexchange"
version = "0.1.0"
description = "Paper-first crypto momentum research and trading bot"
requires-python = ">=3.10"
dependencies = ["alpaca-py>=0.30", "numpy>=1.26", "pandas>=2.1", "pydantic>=2.6", "pydantic-settings>=2.2", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ccexchange = "ccexchange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
